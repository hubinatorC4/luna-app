<!doctype html>
<html lang="pl" data-mode="__MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0705">
<title>Panel moderatora · Luna</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/soft.css">
<link rel="stylesheet" href="/mod-ring.css">
<link rel="stylesheet" href="__P__/mod.css?v=1.0">
</head>
<body class="mp mp-__MODE__">
<header class="mp-top">
  <div class="mp-brand"><span class="mp-shield" aria-hidden="true">🛡️</span><div><b>Panel moderatora</b><small id="mpWho">Zespół Luny · Moderator</small></div></div>
  <div class="mp-topr"><a class="mp-link" href="/" id="mpSite">↗ Strona</a><a class="mp-link" id="mpSwitch" href="__P__/app">📱 Wersja w aplikacji</a><button type="button" class="mp-btn ghost" id="mpLock" hidden>🔒 Zablokuj</button></div>
</header>
<main id="mpMain" class="mp-main" aria-live="polite"><p class="mp-hint">Ładuję… Luna szuka okularów moderatorskich 🤓</p></main>
<nav class="mp-tabs" id="mpTabs" hidden aria-label="Sekcje panelu"></nav>
<dialog id="mpReauth" class="mp-dlg"><form method="dialog" id="mpReauthF">
  <h2>🔐 Potwierdź kodem 2FA</h2><p>To akcja krytyczna (wyłącznik, ban albo wiadomość do wszystkich). Wpisz 6 cyfr z aplikacji uwierzytelniającej.</p>
  <input id="mpOtp" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" placeholder="123456" aria-label="Kod 2FA">
  <div class="mp-row"><button value="cancel" class="mp-btn ghost" type="submit" formnovalidate>Anuluj</button><button value="ok" class="mp-btn primary" type="submit">Potwierdź</button></div>
</form></dialog>
<div id="mpToast" class="mp-toast" role="status" hidden></div>
<script src="__P__/mod.js?v=1.0"></script>
</body>
</html>
