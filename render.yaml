services:
  - type: web
    name: luna-voice-coach
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LUNA_ADMIN_CODE_HASH
        sync: false
