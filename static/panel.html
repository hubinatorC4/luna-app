<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Panel właściciela – Luna</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/panel.css?v=1.4.0">
</head>
<body>
<header class="ph"><b>🔒 Panel właściciela</b><span class="hint">Prywatne statystyki – tylko prawdziwe, zliczone dane. Brak danych = 0.</span><button type="button" id="logout" hidden>Wyloguj</button></header>
<main>
<section id="login" class="card" hidden>
  <h1>Zaloguj się</h1>
  <p class="hint">Wpisz kod producenta. Kod nie jest zapisywany ani logowany; sesja wygasa automatycznie.</p>
  <form id="lf"><input type="password" id="pass" autocomplete="current-password" aria-label="Kod producenta" placeholder="Kod producenta" required><button type="submit">Zaloguj</button></form>
  <p class="err" id="lerr" role="alert"></p>
</section>
<section id="app" hidden>
  <nav class="tabs" role="tablist"><button data-t="butik" class="on">🛍️ Popularność Butiku</button><button data-t="posts">📣 Posty – statystyki</button><button data-t="site">🧭 Sekcje strony</button><button data-t="sus">🤖 Podejrzane konta</button></nav>
  <div class="bar"><span>Zakres:</span><button data-d="7">7 dni</button><button data-d="30" class="on">30 dni</button><button data-d="90">90 dni</button><span class="hint" id="meta"></span></div>
  <div id="view"></div>
</section>
</main>
<script src="/panel.js?v=1.4.0"></script>
</body>
</html>
